name: Dependency Scan

on:
  workflow_call:
    inputs:
      run_backend:
        description: 'Scan backend dependencies'
        type: boolean
        default: true
      run_frontend:
        description: 'Scan frontend dependencies'
        type: boolean
        default: true

jobs:
  npm-audit:
    name: NPM Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Audit Backend Dependencies
        if: inputs.run_backend
        working-directory: ./server
        run: npm audit --audit-level=critical || true

      - name: Audit Frontend Dependencies
        if: inputs.run_frontend
        working-directory: ./client
        run: npm audit --audit-level=critical || true

  trivy-fs:
    name: Trivy Filesystem Scan (SCA)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Run Aqua Trivy Vulnerability Scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'table'
          severity: 'CRITICAL,HIGH'
          exit-code: '0'
