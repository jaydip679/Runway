name: SonarQube Cloud SAST

on:
  workflow_call:

jobs:
  sonarcloud:
    name: SonarQube Cloud Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run SonarQube Scanner
        uses: SonarSource/sonarqube-scan-action@master
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

      # Upload diagnostic scanner logs only if the scanner breaks
      - name: Upload Sonar Scanner Logs on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: sonarqube-failure-logs
          path: .scannerwork/
          retention-days: 7
