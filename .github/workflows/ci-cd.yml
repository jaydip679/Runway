name: Runway CI/CD

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main, dev ]
  workflow_dispatch:

jobs:
  # ========================================================
  # Phase 0: Path Filtering & Change Detection
  # ========================================================
  changes:
    name: Detect Changed Paths
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend == 'true' || github.event_name == 'workflow_dispatch' || github.ref_name == 'main' }}
      frontend: ${{ steps.filter.outputs.frontend == 'true' || github.event_name == 'workflow_dispatch' || github.ref_name == 'main' }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Detect Changes
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            backend:
              - 'server/**'
              - 'Dockerfile'
              - 'docker/**'
              - '.github/workflows/ci-cd.yml'
              - '.github/workflows/code-quality.yml'
            frontend:
              - 'client/**'
              - '.github/workflows/ci-cd.yml'
              - '.github/workflows/code-quality.yml'

  # ========================================================
  # Phase 1: Code Quality & Linting
  # ========================================================
  code-quality:
    name: Code Quality
    needs: changes
    if: needs.changes.outputs.backend == 'true' || needs.changes.outputs.frontend == 'true'
    uses: ./.github/workflows/code-quality.yml
    with:
      run_backend: ${{ needs.changes.outputs.backend == 'true' }}
      run_frontend: ${{ needs.changes.outputs.frontend == 'true' }}

  # ========================================================
  # Phase 2: Secret Scanning (Gitleaks)
  # ========================================================
  secret-scanning:
    name: Secret Scanning
    uses: ./.github/workflows/secret-scanning.yml
    secrets: inherit

  # ========================================================
  # Phase 3: Dependency Vulnerability Scanning (SCA)
  # ========================================================
  dependency-scan:
    name: Dependency Scan
    needs: changes
    if: needs.changes.outputs.backend == 'true' || needs.changes.outputs.frontend == 'true'
    uses: ./.github/workflows/dependency-scan.yml
    with:
      run_backend: ${{ needs.changes.outputs.backend == 'true' }}
      run_frontend: ${{ needs.changes.outputs.frontend == 'true' }}

  # ========================================================
  # Phase 4: Container Security & Docker Scans
  # ========================================================
  docker-scans:
    name: Docker Scans
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    uses: ./.github/workflows/docker-scans.yml
    secrets: inherit

  # ========================================================
  # Phase 5: SAST & Static Code Analysis (SonarQube Cloud)
  # ========================================================
  sonar-qube:
    name: SonarQube SAST
    uses: ./.github/workflows/sonar-scan.yml
    secrets: inherit

  # ========================================================
  # Phase 6: Automated Testing & Build Verification
  # ========================================================
  code-tests:
    name: Automated Tests
    needs: changes
    if: needs.changes.outputs.backend == 'true' || needs.changes.outputs.frontend == 'true'
    uses: ./.github/workflows/code-tests.yml
    with:
      run_backend: ${{ needs.changes.outputs.backend == 'true' }}
      run_frontend: ${{ needs.changes.outputs.frontend == 'true' }}

  # ========================================================
  # Phase 7: Automated Container Build & Deployment to AWS ECS
  # ========================================================
  deploy-ecs:
    name: Deploy to AWS ECS
    needs: [changes, code-tests, docker-scans]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push' && needs.changes.outputs.backend == 'true'
    uses: ./.github/workflows/deploy-ecs.yml
    secrets: inherit

