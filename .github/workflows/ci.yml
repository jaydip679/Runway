name: Runway CI/CD Pipeline

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main, dev ]

jobs:
  backend-ci:
    name: Backend CI
    runs-on: ubuntu-latest
    
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://runway:runway@localhost:5432/runway_test
      REDIS_URL: redis://localhost:6379
      CLIENT_URL: http://localhost:3000
      JWT_ACCESS_SECRET: test_secret_123456789012345678901234567890
      REFRESH_TOKEN_HASH_SECRET: test_hash_secret_1234567890123456789012
      GOOGLE_CLIENT_ID: test_google_id
      GOOGLE_CLIENT_SECRET: test_google_secret
      GOOGLE_CALLBACK_URL: http://localhost:4000/api/v1/auth/google/callback
      CLOUDINARY_CLOUD_NAME: test_cloud
      CLOUDINARY_API_KEY: test_key
      CLOUDINARY_API_SECRET: test_secret
      AI_PROVIDER: gemini
      EMAIL_PROVIDER: mock
      EMAIL_FROM: test@runway.local
      ADMIN_SEED_EMAIL: admin@runway.local
      ADMIN_SEED_PASSWORD: password123

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: runway_test
          POSTGRES_USER: runway
          POSTGRES_PASSWORD: runway
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7.2-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      
      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'server/package-lock.json'
          
      - name: Install Dependencies
        working-directory: ./server
        run: npm ci
        
      - name: Security Audit
        working-directory: ./server
        # Run audit to report vulnerabilities in logs, but prevent blocking the build for unfixable transitive dependencies
        run: npm audit --audit-level=critical || true
        
      - name: Validate Prisma Schema
        working-directory: ./server
        run: npm run prisma:validate
        
      - name: Generate Prisma Client
        working-directory: ./server
        run: npx prisma generate
        
      - name: Push DB Schema
        working-directory: ./server
        run: npx prisma db push
        
      - name: Run Linter (ESLint)
        working-directory: ./server
        run: npm run lint
        
      - name: Run Tests (Jest)
        working-directory: ./server
        run: npm test

  frontend-ci:
    name: Frontend CI
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      
      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'client/package-lock.json'
          
      - name: Install Dependencies
        working-directory: ./client
        run: npm ci
        
      - name: Security Audit
        working-directory: ./client
        run: npm audit --audit-level=critical || true
        
      - name: Run Linter (oxlint)
        working-directory: ./client
        run: npm run lint
        
      - name: Build Application (Vite)
        working-directory: ./client
        run: npm run build
