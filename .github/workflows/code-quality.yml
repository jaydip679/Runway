name: Code Quality

on:
  workflow_call:
    inputs:
      run_backend:
        description: 'Run backend linting'
        type: boolean
        default: true
      run_frontend:
        description: 'Run frontend linting'
        type: boolean
        default: true

jobs:
  lint-backend:
    name: Lint Backend (ESLint)
    if: inputs.run_backend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'server/package-lock.json'

      - name: Install Dependencies
        working-directory: ./server
        run: npm ci

      - name: Run ESLint
        working-directory: ./server
        run: npm run lint

  lint-frontend:
    name: Lint Frontend (Oxlint)
    if: inputs.run_frontend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'client/package-lock.json'

      - name: Install Dependencies
        working-directory: ./client
        run: npm ci

      - name: Run Oxlint
        working-directory: ./client
        run: npm run lint
