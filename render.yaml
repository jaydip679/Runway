services:
  # ----------------------------------------------------
  # Backend API & Worker Service
  # ----------------------------------------------------
  - type: web
    name: runway-backend
    env: node
    region: oregon
    rootDir: server
    buildCommand: npm install && npx prisma generate && npx prisma migrate deploy
    startCommand: npm run start:prod
    healthCheckPath: /health/ready
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false # Set securely in Render dashboard
      - key: REDIS_URL
        sync: false # Set securely in Render dashboard
      - key: CLIENT_URL
        sync: false
      - key: JWT_ACCESS_SECRET
        sync: false
      - key: REFRESH_TOKEN_HASH_SECRET
        sync: false
      - key: SENTRY_BACKEND_DSN
        sync: false
