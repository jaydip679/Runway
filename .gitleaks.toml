# Gitleaks Configuration
# Extends default rules and whitelists test fixtures and example files

[extend]
useDefault = true

[allowlist]
description = "Allowlist for test fixtures, configs, and example templates"
paths = [
  '''(?i)\.env\.example$''',
  '''(?i).*\.test\.js$''',
  '''(?i).*/__tests__/.*''',
  '''(?i).*/tests/.*''',
  '''(?i)sonar-project\.properties$''',
  '''(?i)\.github/workflows/code-tests\.yml$''',
]
