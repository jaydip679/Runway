# SonarQube / SonarCloud Project Configuration
sonar.projectKey=jaydip679_Runway
sonar.organization=jaydip679

# Source Code
sonar.sources=server/src,client/src
sonar.tests=server/src/__tests__,server/tests

# Exclusions
sonar.exclusions=**/node_modules/**,**/dist/**,**/build/**,**/coverage/**,**/storage/**,server/prisma/**,client/public/**
sonar.test.inclusions=**/*.test.js,**/*.test.jsx,**/*.spec.js,**/*.spec.jsx

# Coverage & Encoding
sonar.javascript.lcov.reportPaths=server/coverage/lcov.info
sonar.sourceEncoding=UTF-8
